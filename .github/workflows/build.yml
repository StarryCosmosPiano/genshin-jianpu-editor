name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '更新现有桌面 Release 的标签；留空仅部署在线版'
        required: false
        default: ''
        type: string
  release:
    types: [published]

jobs:
  build:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Resolve existing version release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='yuanqin-v'+v)throw new Error('Release tag does not match the application version')"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Type check
        run: npx tsc --noEmit

      - name: Core regression checks
        run: npm run check:core

      - name: Verify release contains no bundled SF2
        run: >-
          node -e "const fs=require('fs');const dir='src/assets/soundfonts';const files=fs.existsSync(dir)?fs.readdirSync(dir).filter((name)=>name.toLowerCase().endsWith('.sf2')):[];if(files.length)throw new Error('SF2 files must not be included in release packages - '+files.join(', '))"

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          releaseAssetNamePattern: Yuanqin.Editor_[version]_[arch][setup][ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # main/空标签的手动运行部署网页；发布事件/指定标签只更新桌面安装包。
  pages-build:
    if: github.event_name != 'release' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Core regression checks
        run: npm run check:core
      - name: Build (subpath base for project Pages)
        run: npm run build
        env:
          BASE_PATH: /genshin-jianpu-editor/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
