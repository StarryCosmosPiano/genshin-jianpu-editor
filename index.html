    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "原琴简谱编辑器",
          "alternateName": "Genshin Jianpu Editor",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Windows, macOS, Web",
          "softwareVersion": "0.3.0",
          "url": "https://starrycosmospiano.github.io/genshin-jianpu-editor/",
          "downloadUrl": "https://github.com/StarryCosmosPiano/genshin-jianpu-editor/releases",
          "screenshot": "https://starrycosmospiano.github.io/genshin-jianpu-editor/og-image.png",
          "description": "面向原神琴谱制作的开源简谱编辑器、MIDI 转谱与 SVG 排版工具。An open-source jianpu editor and MIDI converter for Genshin musicians.",
          "featureList": [
            "实时编辑 .jpwabc 数字谱并即时排版预览",
            "简谱图片识别（OMR）：把简谱照片/截图识别成乐谱（本地 PaddleOCR 离线识别，或 Gemini 整页转写），再排版编辑",
            "ABC 记谱导入：拖入/打开 .abc 自动转 MusicXML 排版（忠实移植 abc2xml）",
            "简谱与五线谱混排（加载 MusicXML 排版，含连音线/连谱号/力度/踏板/和弦记号）",
            "MusicXML 导入转简谱",
            "乐谱播放：光标跟随 + 两路音源",
            "导出 PDF / PNG / MIDI / 矢量 PPTX",
            "点选高亮与自动分页（16:9 / 4:3 / A4 / A3）",
            "跨平台：浏览器在线版 + Windows/macOS 桌面版"
          ],
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "license": "https://github.com/StarryCosmosPiano/genshin-jianpu-editor/blob/main/LICENSE",
          "author": { "@type": "Person", "name": "StarryCosmosPiano" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "什么是原琴简谱编辑器？",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "原琴简谱编辑器是一款面向原神琴谱制作的开源简谱排版与 MIDI 转谱工具。左侧编辑代码、右侧实时渲染简谱，支持键盘谱、数字谱、MusicXML、ABC、OMR 以及 PDF、PNG、MIDI、矢量 PPTX 导出。"
              }
            },
            {
              "@type": "Question",
              "name": ".jpwabc 是什么格式？",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": ".jpwabc 是 JP-Word 简谱软件使用的文本谱面格式，按 .Title/.Voice/.Words 等小节描述标题、调号拍号、音符与歌词。原琴简谱编辑器用 ANTLR 解析该格式并排版为 SVG 简谱。文件以 UTF-16LE（带 BOM）编解码以兼容 JP-Word。"
              }
            },
            {
              "@type": "Question",
              "name": "如何把 MusicXML 转成简谱？",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "在原琴简谱编辑器中打开或拖入 .musicxml/.xml 文件即可导入并转换为简谱；也可用「混排」模式直接按五线谱与简谱混合排版。"
              }
            },
            {
              "@type": "Question",
              "name": "原琴简谱编辑器能识别简谱图片吗？（OMR）",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "可以。点工具栏「识图」，选择识别方式即可把简谱照片或截图识别成乐谱并排版：一是「musicpp」本地方式，完全在浏览器/桌面本地运行、可离线，数字用 PaddleOCR PP-OCRv4 识别，还能识别歌词并逐音节对齐（数字实测约 100%、完整 token 约 95%）；二是「Gemini」整页转写方式（仅桌面版，经 agy 调用，对真实照片更准）。识别结果会走 MusicXML 导入路径转成简谱，可继续编辑、排版、导出。"
              }
            },
            {
              "@type": "Question",
              "name": "原琴简谱编辑器支持 ABC 记谱导入吗？",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "支持。把 .abc 文件拖入或用「打开」选择，程序会自动将 ABC 记谱转成 MusicXML 再排版为简谱，支持多声部、连奏、重复、和弦、装饰音与调号变更等。"
              }
            },
            {
              "@type": "Question",
              "name": "macOS 提示「已损坏」或「无法验证开发者」怎么办？",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "因应用未购买苹果开发者签名，首次打开可能被拦截。把 Genshin Jianpu Editor.app 拖入「应用程序」后，可在终端使用 xattr -cr 清除该应用的隔离标记；或者直接使用浏览器在线版。"
              }
            }
          ]
        }
      ]
    }

  <body>
    <div id="app">
      <div id="toolbar">
        <button id="btn-create" title="创建 JPW 简谱、键盘谱或数字谱">创建</button>
        <button id="btn-open">打开</button>
        <button id="btn-save">保存</button>
        <button id="btn-saveas">另存为</button>
        <button id="btn-export">导出</button>
        <button id="btn-mixed" disabled>混排</button>
        <button id="btn-recognize" title="识别模式：二值图 + 半透明识别结果叠加核对" disabled>识别</button>
        <select id="sel-recog-view" title="识别视图" hidden>
          <option value="floating">附近浮窗</option>
          <option value="inplace">原位叠加</option>
          <option value="original">仅原图</option>
        </select>
        <button id="btn-phrase" title="按乐句分析自动断行排版，可切回原始排版" disabled>乐句排版</button>
        <span class="sep"></span>
        <button id="btn-options">选项</button>
        <button id="btn-score-settings" title="修改当前键盘谱或数字谱的识别、节奏、拍号、速度与标题设置">乐谱设置</button>
        <button id="btn-layout-style" title="调整数字、和弦、花括号和小节线并应用到全部简谱">排版</button>
        <span class="sep"></span>
        <button id="btn-preview-lock" type="button" aria-pressed="false" title="暂停文本编辑引起的实时重排">锁定谱面</button>
        <button id="btn-play">播放</button>
        <button id="btn-stop">停止</button>
        <div id="rhythm-grid-control" role="group" aria-label="音符移动与节奏刻度">
          <span class="rhythm-grid-label">刻度</span>
          <button type="button" data-rhythm-division="64" title="64 分音符刻度；再次点击恢复自动" aria-label="64 分音符刻度"><span class="rhythm-grid-glyph">&#x1D163;</span></button>
          <button type="button" data-rhythm-division="32" title="32 分音符刻度；再次点击恢复自动" aria-label="32 分音符刻度"><span class="rhythm-grid-glyph">&#x1D162;</span></button>
          <button type="button" data-rhythm-division="16" title="16 分音符刻度；再次点击恢复自动" aria-label="16 分音符刻度"><span class="rhythm-grid-glyph">&#x1D161;</span></button>
          <button type="button" data-rhythm-division="8" title="8 分音符刻度；再次点击恢复自动" aria-label="8 分音符刻度"><span class="rhythm-grid-glyph">&#x1D160;</span></button>
          <button type="button" data-rhythm-division="4" title="4 分音符刻度；再次点击恢复自动" aria-label="4 分音符刻度"><span class="rhythm-grid-glyph">&#x1D15F;</span></button>
          <button type="button" data-rhythm-division="2" title="2 分音符刻度；再次点击恢复自动" aria-label="2 分音符刻度"><span class="rhythm-grid-glyph">&#x1D15E;</span></button>
          <button type="button" data-rhythm-division="1" title="全音符刻度；再次点击恢复自动" aria-label="全音符刻度"><span class="rhythm-grid-glyph">&#x1D15D;</span></button>
        </div>
        <span class="sep"></span>
        <button id="btn-zoom-out" title="缩小 (Ctrl/⌘ -)">−</button>
        <button id="btn-zoom-reset" title="复位 (Ctrl/⌘ 0)">100%</button>
        <button id="btn-zoom-in" title="放大 (Ctrl/⌘ +)">＋</button>
        <span class="sep"></span>
        <button id="btn-prev">上一页</button>
        <button id="btn-next">下一页</button>
        <span class="sep"></span>
        <button id="btn-help" title="功能帮助与记谱法说明">帮助</button>
      </div>
      <div id="body">
        <div id="code-pane"></div>
        <button id="code-pane-toggle" type="button" aria-label="隐藏或展开文本编辑器" aria-expanded="true" title="隐藏文本编辑器">◀</button>
        <div id="score-pane"></div>
      </div>
      <div id="status"></div>
    </div>
    <!-- hidden off-screen svg used for getBBox/getComputedTextLength measurement -->
    <svg id="measure-svg" width="0" height="0" aria-hidden="true"></svg>
  </body>
